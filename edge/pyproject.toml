[project]
name = "edge-python-sdk"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
    "grpcio-health-checking>=1.60.0",
    "ruff>=0.15.12",
    "pytest>=9.0.3",
    "zqnt-utils @ https://github.com/Zequent/zqnt-utils-python/releases/download/v1.0.0/zqnt_utils-1.0.0-py3-none-any.whl",
]

[project.optional-dependencies]
redis = [
    "redis[asyncio]>=5.0.0",
]
dev = [
    "grpcio-tools>=1.60.0",
    "grpc-stubs>=1.53.0",
    "mypy-protobuf>=3.6.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "fakeredis[aioredis]>=2.26.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edge_sdk"]
[tool.uv.sources]
zqnt-utils = { url = "https://github.com/Zequent/zqnt-utils-python/releases/download/v1.0.0/zqnt_utils-1.0.0-py3-none-any.whl" }
