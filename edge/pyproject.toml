[project]
name = "edge-python-sdk"
version = "1.2.3"
description = "Python SDK for implementing ZQNT Edge Adapters"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
    "grpcio-health-checking>=1.60.0",
    "zqnt-utils>=2.0.0",
]

[project.optional-dependencies]
redis = [
    "redis[asyncio]>=8.0.0",
]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "fakeredis[aioredis]>=2.26.0",
    "ruff>=0.15.12",
    "zqnt-utils",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]  # line-too-long (handled by formatter)

[tool.ruff.lint.per-file-ignores]
"edge_sdk/server/edge_server.py" = ["N802"]  # gRPC servicer methods must match PascalCase proto names

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edge_sdk"]

[tool.uv.sources]
# 2.0.0 isn't cut as a real zqnt-utils-python release yet, so this floats on its `main` branch
# (whatever is currently pushed there) rather than a tag that doesn't exist -- matches this
# repo's own main being the floating "2.0.0-track" counterpart to feature/v1.3.0-proto (see
# zqnt-protos' README "Versioning" section). Re-run `uv lock -P zqnt-utils` to pick up a newer
# main once one lands, or repoint this at a real tag once zqnt-utils-python cuts one.
zqnt-utils = { git = "https://github.com/zequent/zqnt-utils-python", branch = "main" }
