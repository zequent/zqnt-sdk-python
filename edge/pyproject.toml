[project]
name = "edge-python-sdk"
version = "1.2.3"
description = "Python SDK for implementing ZQNT Edge Adapters"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
    "grpcio-health-checking>=1.60.0",
    "zqnt-utils>=2.0.0",
]

[project.optional-dependencies]
redis = [
    "redis[asyncio]>=8.0.0",
]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "fakeredis[aioredis]>=2.26.0",
    "ruff>=0.15.12",
    "zqnt-utils",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]  # line-too-long (handled by formatter)

[tool.ruff.lint.per-file-ignores]
"edge_sdk/server/edge_server.py" = ["N802"]  # gRPC servicer methods must match PascalCase proto names

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edge_sdk"]

[tool.uv.sources]
# Local editable path is the preferred default for day-to-day monorepo development (offline-
# friendly, picks up sibling edits immediately, no push-then-pull round trip). Swap to the git
# line below only when you actually need standalone/external resolution -- verifying this repo
# installs correctly outside the monorepo, CI that doesn't check out the whole monorepo, etc.
# 2.0.0 isn't cut as a real zqnt-utils-python release yet, so that alternative floats on its
# `main` branch rather than a tag that doesn't exist.
#zqnt-utils = { git = "https://github.com/zequent/zqnt-utils-python", branch = "main" }
zqnt-utils = { path = "../../../utils/zqnt-utils-python", editable = true }
