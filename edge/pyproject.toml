[project]
name = "edge-python-sdk"
version = "2.0.0"
description = "Python SDK for implementing ZQNT Edge Adapters"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
    "grpcio-health-checking>=1.60.0",
    "cryptography>=42.0.0",
    "zqnt-utils>=2.0.0",
]

[project.optional-dependencies]
redis = [
    "redis[asyncio]>=8.0.0",
]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "fakeredis[aioredis]>=2.26.0",
    "ruff>=0.15.12",
    "zqnt-utils",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]  # line-too-long (handled by formatter)

[tool.ruff.lint.per-file-ignores]
"edge_sdk/server/edge_server.py" = ["N802"]  # gRPC servicer methods must match PascalCase proto names
"edge_sdk/server/edge_server_v3.py" = ["N802"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edge_sdk"]

[tool.uv.sources]
# A git source, not a local path: CI and Docker builds check out only this repository.
# uv allows one URL per package across a graph, so every consumer pins the same ref.
# 3.0.0 preview: the v3 contracts (zequent/zqnt-utils-python#41) -- back to the release tag
# (v3.0.0) after the release.
zqnt-utils = { git = "https://github.com/zequent/zqnt-utils-python", branch = "feature/v3-agentic" }
# Swap to this for day-to-day monorepo development (offline-friendly, picks up sibling edits
# immediately, no push-then-pull round trip) -- but keep it local-only; don't commit it back to
# main, or every downstream adapter's CI breaks again the same way this fix closes.
#zqnt-utils = { path = "../../../utils/zqnt-utils-python", editable = true }
