[project]
name = "edge-python-sdk"
version = "1.3.0"
description = "Python SDK for implementing ZQNT Edge Adapters — pinned to the 1.3.0 wire contract"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
    "grpcio-health-checking>=1.60.0",
    "zqnt-utils>=1.3.0,<2.0.0",
]

[project.optional-dependencies]
redis = [
    "redis[asyncio]>=8.0.0",
]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "fakeredis[aioredis]>=2.26.0",
    "ruff>=0.15.12",
    "zqnt-utils",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]  # line-too-long (handled by formatter)

[tool.ruff.lint.per-file-ignores]
"edge_sdk/server/edge_server.py" = ["N802"]  # gRPC servicer methods must match PascalCase proto names

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edge_sdk"]

[tool.uv.sources]
# This branch is the Python counterpart of zqnt-utils-golang's feature/v1.3.0-proto: pinned to
# the 1.3.0 wire contract specifically, not the current (2.0.0) line -- see
# utils/zqnt-utils-python's own v1.3.0 tag and zqnt-protos' README "Versioning" section.
zqnt-utils = { git = "https://github.com/zequent/zqnt-utils-python", tag = "v1.3.0" }
#zqnt-utils = { path = "../../../utils/zqnt-utils-python", editable = true }
