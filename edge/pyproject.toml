[project]
name = "edge-python-sdk"
version = "1.2.3"
description = "Python SDK for implementing ZQNT Edge Adapters"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
    "grpcio-health-checking>=1.60.0",
    "zqnt-utils>=2.0.0",
]

[project.optional-dependencies]
redis = [
    "redis[asyncio]>=8.0.0",
]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "fakeredis[aioredis]>=2.26.0",
    "ruff>=0.15.12",
    "zqnt-utils",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]  # line-too-long (handled by formatter)

[tool.ruff.lint.per-file-ignores]
"edge_sdk/server/edge_server.py" = ["N802"]  # gRPC servicer methods must match PascalCase proto names

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edge_sdk"]

[tool.uv.sources]
# main must stay externally consumable: any adapter that git-fetches this repo (required for
# Docker/CI builds, where a local-editable path can't resolve outside the monorepo checkout)
# needs edge-python-sdk's OWN dependency sources to resolve too -- uv does not let a downstream
# project's [tool.uv.sources] override reach into a git-fetched dependency's own nested source
# declaration, confirmed by trying it and watching it fail.
#
# zqnt-utils-python's own main is now the 1.3.0 line (matching the Java repos' convention: main
# == their v1.3.0 tag) -- its 2.0.0-track content (AssetVendor.ZQNT, Theatre/Event Trigger, the
# CommandExecutionEvent notification shape this repo's own code actually needs) lives on
# refactoring/refactoring-ecosystem-v2 instead. zqnt-utils-python's real v2.0.0 tag is also stale
# regardless (predates that branch). Float on the branch until a fresh 2.0.0-track tag is cut.
zqnt-utils = { git = "https://github.com/zequent/zqnt-utils-python", branch = "refactoring/refactoring-ecosystem-v2" }
# Swap to this for day-to-day monorepo development (offline-friendly, picks up sibling edits
# immediately, no push-then-pull round trip) -- but keep it local-only; don't commit it back to
# main, or every downstream adapter's CI breaks again the same way this fix closes.
#zqnt-utils = { path = "../../../utils/zqnt-utils-python", editable = true }
