[project]
name = "edge-python-sdk"
version = "3.0.0"
description = "Python SDK for implementing ZQNT Edge Adapters"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "grpcio>=1.84.0",
    "protobuf>=4.25.0",
    "grpcio-health-checking>=1.60.0",
    "cryptography>=42.0.0",
    "zqnt-api",
]

[project.optional-dependencies]
redis = [
    "redis[asyncio]>=8.1.0",
]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "fakeredis[aioredis]>=2.39.0",
    "ruff>=0.15.12",
    "redis[asyncio]>=8.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]  # line-too-long (handled by formatter)

[tool.ruff.lint.per-file-ignores]
"edge_sdk/server/edge_server.py" = ["N802"]  # gRPC servicer methods must match PascalCase proto names
"edge_sdk/server/edge_server_v3.py" = ["N802"]
"tests/integration/test_v3_platform_calls.py" = ["N802"]  # fake platform servicers

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edge_sdk"]

[tool.uv.sources]
zqnt-api = { git = "https://github.com/zequent/zqnt-api", subdirectory = "python", rev = "836cd676cd2f420234e5ba5dc9b01dd8873d4596" }
