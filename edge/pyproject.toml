[project]
name = "edge-python-sdk"
version = "3.0.0"
description = "Python SDK for implementing ZQNT Edge Adapters"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "grpcio>=1.84.0",
    "protobuf>=4.25.0",
    "grpcio-health-checking>=1.60.0",
    "cryptography>=42.0.0",
    "zqnt-api",
]

[project.optional-dependencies]
redis = [
    "redis[asyncio]>=8.1.0",
]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "fakeredis[aioredis]>=2.40.0",
    "ruff>=0.15.12",
    "redis[asyncio]>=8.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edge_sdk"]

[tool.uv.sources]
zqnt-api = { git = "https://github.com/zequent/zqnt-api", subdirectory = "python", tag = "pr-57-71a81e8" }
