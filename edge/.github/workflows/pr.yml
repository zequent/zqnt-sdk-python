name: PR Checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    permissions:
      contents: read
      packages: read
      pull-requests: write
    runs-on: ubuntu-latest
    name: Lint, Test & Build

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@6dfebec6ddbcd197e02256fbdf54deb334fb7f06 # v2.1.2
      - name: Install dependencies
        # Private git dependencies: the token lives only in this step's environment, never in a
        # file on the runner that later steps (tests, builds) could read.
        env:
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.GH_PAT }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
          GIT_CONFIG_KEY_1: url.https://x-access-token:${{ secrets.GH_PAT }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_1: "git@github.com:"
        run: |
          uv sync --all-extras

      - name: Lint with ruff
        run: |
          uv run ruff check --exit-zero .
          uv run ruff format --check .

      - name: Run tests
        run: |
          uv run pytest tests/ -v

      - name: Build package
        run: |
          uv run --with build python -m build

      - name: Extract PR info
        id: pr_info
        run: |
          VERSION=$(grep "^version" pyproject.toml | cut -d'"' -f2)
          PR_NUMBER=${{ github.event.number }}
          COMMIT_HASH=$(git rev-parse --short HEAD)

          PR_VERSION="${VERSION}+pr${PR_NUMBER}.${COMMIT_HASH}"

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "pr_version=${PR_VERSION}" >> $GITHUB_OUTPUT
          echo "pr_number=${PR_NUMBER}" >> $GITHUB_OUTPUT
          echo "commit_hash=${COMMIT_HASH}" >> $GITHUB_OUTPUT

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-pr-${{ github.event.number }}
          path: dist/
          retention-days: 5

      - name: Comment PR with build info
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const buildExists = fs.existsSync('./dist');

            const message = buildExists
              ? `Build successful

            **Pre-release version**: \`${{ steps.pr_info.outputs.pr_version }}\``
              : `Build failed`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
