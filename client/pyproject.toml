[project]
name = "zqnt-client-sdk"
version = "1.0.1"
description = "Python Client SDK for the Zequent Framework"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
    "zqnt-utils>=2.0.0",
]

[project.optional-dependencies]
dotenv = [
    "python-dotenv>=1.0.0",
]
dev = [
    "grpcio-tools>=1.60.0",
    "grpc-stubs>=1.53.0",
    "mypy-protobuf>=3.6.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]  # line-too-long (handled by formatter)

[tool.ruff.lint.per-file-ignores]
# Local aliases for nested protobuf classes keep PascalCase to match the proto names
"client_sdk/mission_autonomy/_converters.py" = ["N806"]
# CircuitBreakerOpen is a state name, not a generic error
"client_sdk/grpc_/resilience.py" = ["N818"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["client_sdk"]
[tool.uv.sources]
# Local editable path is the preferred default for day-to-day monorepo development (offline-
# friendly, picks up sibling edits immediately, no push-then-pull round trip). Swap to the git
# line below only when you actually need standalone/external resolution -- verifying this repo
# installs correctly outside the monorepo, CI that doesn't check out the whole monorepo, etc.
# 2.0.0 isn't cut as a real zqnt-utils-python release yet, so that alternative floats on its
# `main` branch rather than a tag that doesn't exist.
#zqnt-utils = { git = "https://github.com/zequent/zqnt-utils-python", branch = "main" }
zqnt-utils = { path = "../../../utils/zqnt-utils-python", editable = true }

