[project]
name = "zqnt-client-sdk"
version = "1.3.0"
description = "Python Client SDK for the Zequent Framework — pinned to the 1.3.0 wire contract"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
    "zqnt-utils>=1.3.0,<2.0.0",
]

[project.optional-dependencies]
dotenv = [
    "python-dotenv>=1.0.0",
]
dev = [
    "grpcio-tools>=1.60.0",
    "grpc-stubs>=1.53.0",
    "mypy-protobuf>=3.6.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]  # line-too-long (handled by formatter)

[tool.ruff.lint.per-file-ignores]
# Local aliases for nested protobuf classes keep PascalCase to match the proto names
"client_sdk/mission_autonomy/_converters.py" = ["N806"]
# CircuitBreakerOpen is a state name, not a generic error
"client_sdk/grpc_/resilience.py" = ["N818"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["client_sdk"]
[tool.uv.sources]
# This branch is the Python counterpart of zqnt-utils-golang's feature/v1.3.0-proto: pinned to
# the 1.3.0 wire contract specifically, not the current (2.0.0) line -- see
# utils/zqnt-utils-python's own v1.3.0 tag and zqnt-protos' README "Versioning" section.
zqnt-utils = { git = "https://github.com/zequent/zqnt-utils-python", tag = "v1.3.0" }
#zqnt-utils = { path = "../../../utils/zqnt-utils-python", editable = true }

