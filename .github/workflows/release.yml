name: Release

# A release is the tag vX.Y.Z, cut by the maintainer. Both packages get the tag's version; their
# wheels and sdists are attached to the GitHub Release, and uv consumers pin the tag.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Test & publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"

      - name: Version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set version
        run: sed -i "s/^version = \".*\"/version = \"${{ steps.version.outputs.version }}\"/" edge/pyproject.toml client/pyproject.toml

      - name: Test
        run: |
          uv sync --all-packages --all-extras
          (cd edge && uv run pytest -q)
          (cd client && uv run pytest -q)

      - name: Build
        run: uv build --all-packages --out-dir dist

      - name: GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: false
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
