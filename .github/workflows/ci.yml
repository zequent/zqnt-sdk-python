name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '**/docker-compose*.yml'
      - '.github/dependabot.yml'
  push:
    branches: [main, feature/v3-agentic]

# Pushes get a group of their own, so none of them is ever cancelled or dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.24.3"
  GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c

jobs:
  test:
    name: ${{ matrix.package }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [edge, client]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --frozen --all-packages --all-extras

      - name: Lint
        working-directory: ${{ matrix.package }}
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .

      - name: Test
        working-directory: ${{ matrix.package }}
        run: uv run --frozen pytest -v

      - name: Build
        run: uv build --package "$(sed -n 's/^name = "\(.*\)"/\1/p' ${{ matrix.package }}/pyproject.toml | head -1)" --out-dir dist

  secrets:
    name: Secret scan
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact .

  # Every PR build is tagged pr-<n>-<sha> (never v*: that would start a release); consumers pin
  # that tag with subdirectory = "edge" or "client".
  preview-tag:
    name: Tag PR preview
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [test, secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute preview tag
        id: tag
        run: |
          TAG="pr-${{ github.event.pull_request.number }}-$(git rev-parse --short=7 HEAD)"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          {
            echo "Preview tag: \`${TAG}\` (commit $(git rev-parse HEAD))"
            echo ""
            echo "- \`edge-python-sdk = { git = \"https://github.com/zequent/zqnt-sdk-python\", subdirectory = \"edge\", tag = \"${TAG}\" }\`"
            echo "- \`zqnt-client-sdk = { git = \"https://github.com/zequent/zqnt-sdk-python\", subdirectory = \"client\", tag = \"${TAG}\" }\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push preview tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag "${{ steps.tag.outputs.tag }}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${{ steps.tag.outputs.tag }}"
